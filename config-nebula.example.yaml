# ============================================================
# Nebula VPN Config Generator — Пример мастер-конфига
# ============================================================
# Скопируйте этот файл в config-nebula.yaml и заполните значения.
# config-nebula.yaml находится в .gitignore — не коммитите его.

# ----------------------------------------------------------
# Общие настройки сети
# ----------------------------------------------------------

# Имя сети — используется для генерации CA-сертификата
net-name: my-vpn-network

# Имя интерфейса для nebula
dev: nebula1

# ----------------------------------------------------------
# CA-ключи (все три поля опциональны, но нужны для работы)
# ----------------------------------------------------------

# Inline CA PEM — CA-сертификат в формате PEM (не base64)
# Оставьте пустым, если хотите сгенерировать CA автоматически
ca_pem: ""

# Key-based signing public address — для подписи сертификатов через -in-pub
# Оставьте пустым, если не используете key-based signing
in_pub: ""

# Путь к внешнему CA-ключу (необязательно)
# Если задан, генерация CA пропускается и используется существующий ca.key.
# ca.crt всё равно генерируется из этого ключа.
# Формат: абсолютный путь к файлу ca.key
ca_key_path: ""

# Путь к бинарнику nebula-cert (необязательно)
# Можно задать через --cert-path при запуске
# ca_cert_path: ""

# ----------------------------------------------------------
# Отозванные сертификаты (опционально)
# ----------------------------------------------------------
# SHA-256 отпечатки отозванных сертификатов.
# Генератор пробросит их в pki.blocklist каждого узла.
# Получить отпечаток: openssl x509 -in cert.crt -fingerprint -sha256 -noout
blocklist:
  # - "sha256:ABCD1234..."

# ----------------------------------------------------------
# Relay-серверы
# ----------------------------------------------------------
# Nebula-IP узлов, через которые клиенты за NAT будут проходить.
# Должны быть публичными узлами (port отличный от 0).
relay_servers:
  - 192.168.10.101

# ----------------------------------------------------------
# Маяки (Lighthouse)
# ----------------------------------------------------------
lighthouse:
  lh-1:
    # Группы доступа — для firewall правил
    groups: home

    # Внутренний IP + CIDR (IPv4 и/или IPv6)
    nebula_ip:
      ipv4: 192.168.10.101/24
      ipv6: fd00:1234:5678:a::101/64

    # Порт прослушивания nebula (обычно 4242)
    port: 4242

    # Публичный IP (внешний IP узла)
    public_ip: 203.0.113.1

    # am_relay: true — этот lighthouse является relay-сервером
    am_relay: true

# ----------------------------------------------------------
# Хосты (Hosts)
# ----------------------------------------------------------
hosts:
  # --------------------------------------------------------
  # Пример 1: Публичный хост (hole-punch)
  # --------------------------------------------------------
  server-1:
    groups: home,ssh

    nebula_ip:
      ipv4: 192.168.10.100/24
      ipv6: fd00:1234:5678:a::100/64

    # Публичный IP — ОБЯЗАТЕЛЕН для hole-punch
    public_ip: 203.0.113.2

    # Порт (число, не строка!) — 4242 = публичный, 0 = NAT
    port: 4242

    # Автодеплой: пользователь@IP:/путь/куда/класть
    # Без этого поля узел не деплоится автоматически
    ssh_target: admin@203.0.113.2:/etc/nebula

  # --------------------------------------------------------
  # Пример 2: NAT-клиент (behind NAT)
  # --------------------------------------------------------
  client-1:
    groups: home,ssh

    nebula_ip:
      ipv4: 192.168.10.102/24
      ipv6: fd00:1234:5678:a::102/64

    # public_ip НЕ нужен — узел за NAT
    # public_ip: ...

    # port: 0 — узел за NAT, использует relay
    port: 0

    # Автодеплой (если есть SSH-доступ)
    ssh_target: admin@192.168.1.100:/etc/nebula

  # --------------------------------------------------------
  # Пример 3: Узел с IPv6
  # --------------------------------------------------------
  ipv6-host:
    groups: home

    nebula_ip:
      ipv4: 192.168.10.103/24
      ipv6: fd00:1234:5678:a::103/64

    public_ip: 203.0.113.3
    port: 4242
    # Автодеплой
    ssh_target: admin@203.0.113.3:/etc/nebula
