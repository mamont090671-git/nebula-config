net-name: x-net

# Relay-серверы — nebula-IP узлов, через которые клиенты за NAT будут проходить
relay_servers:
  - 192.168.10.101

# Inline CA PEM (base64-encoded, optional)
ca_pem: ""

# Key-based signing public address (optional, for -in-pub)
in_pub: ""

